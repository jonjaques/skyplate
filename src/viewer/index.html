    <script>
      // Resolve the theme before first paint so the page never flashes the wrong one. The
      // viewer's theme toggle writes "skyplate-theme"; absent that, follow the OS setting.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("skyplate-theme"); } catch (e) {}
        var dark = pref ? pref === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <!-- Development entry. build.ts swaps this module script for the classic bundle. -->
  </head>
