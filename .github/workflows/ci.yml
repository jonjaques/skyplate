# The gate on every PR and on main: the same three commands prepublishOnly runs, so what CI
# passed is what `bun publish` would ship, and then that package installed and run.
#
# Bun is pinned to the version the suite was last run on locally; `bun check` (TypeScript 7)
# and the async TypeScript API the analyzer uses move with Bun releases, so "latest" would let
# an unrelated Bun bump turn CI red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun check
      - run: bun test
      # The package as a user gets it, not the checkout: a bare import missing from
      # `dependencies`, or a file missing from `files`, only fails once the tarball is installed
      # somewhere else, which bun test never does (CLAUDE.md, "The npm package ships..."). The
      # stale-viewer note must stay quiet too: an installed copy has no viewer source to compare.
      - name: Smoke-test the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/smoke/proj"
          bun pm pack --destination "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/smoke"
          echo '{"name":"smoke","private":true}' > package.json
          bun add "$RUNNER_TEMP"/pack/skyplate-*.tgz
          printf 'export const a = 1;\n' > proj/a.ts
          printf 'import { a } from "./a";\nconsole.log(a);\n' > proj/b.ts
          ./node_modules/.bin/skyplate proj --out report 2> err.txt || { cat err.txt; exit 1; }
          cat err.txt
          test -f report/index.html
          if grep -q 'note:' err.txt; then echo "an installed copy printed a note meant for checkouts"; exit 1; fi
